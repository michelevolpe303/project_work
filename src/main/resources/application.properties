spring.application.name=demo

# Configurazione connessione MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/mydb
spring.datasource.username=myuser
spring.datasource.password=mypass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (JPA) configurazione
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect specifico di MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Altre configurazioni opzionali
server.port=8080

# Forza Hibernate a non convertire in minuscolo i nomi delle tabelle
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
