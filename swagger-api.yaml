openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /register:
    post:
      tags:
      - utente-controller
      summary: Registra un nuovo utente
      description: Crea un nuovo utente con i dati forniti e associa un conto principale
        con alias scelto.
      operationId: registerUser
      parameters:
      - name: nome
        in: query
        description: Nome dell'utente
        required: true
        schema:
          type: string
        example: Mario
      - name: cognome
        in: query
        description: Cognome dell'utente
        required: true
        schema:
          type: string
        example: Rossi
      - name: username
        in: query
        description: Username univoco
        required: true
        schema:
          type: string
        example: mrossi
      - name: password
        in: query
        description: Password dell'account
        required: true
        schema:
          type: string
        example: password123
      - name: alias
        in: query
        description: Alias del conto principale
        required: true
        schema:
          type: string
        example: Conto Principale
      responses:
        "201":
          description: Registrazione avvenuta con successo
          content:
            text/plain:
              schema:
                type: string
                example: Registrazione avvenuta con successo.
        "409":
          description: Nome utente già in uso
          content:
            text/plain:
              schema:
                type: string
                example: Il nome utente scelto è già in uso.
  /api/prestito/richiedi:
    post:
      tags:
      - prestito-controller
      summary: Richiede un prestito
      description: Permette all’utente autenticato di richiedere un prestito specificando
        importo e numero di rate.
      operationId: richiediPrestito
      parameters:
      - name: importoRichiesto
        in: query
        description: Importo richiesto
        required: true
        schema:
          type: integer
          format: int32
        example: 5000
      - name: numeroRate
        in: query
        description: Numero di rate per il rimborso
        required: true
        schema:
          type: integer
          format: int32
        example: 24
      responses:
        "201":
          description: Prestito richiesto con successo
          content:
            text/plain:
              schema:
                type: string
                example: Prestito richiesto con successo
  /api/prestiti/pagaRata/{idPrestito}:
    post:
      tags:
      - prestito-controller
      summary: Paga una rata di un prestito
      description: Permette all’utente di pagare una rata del prestito identificato
        da `idPrestito`.
      operationId: pagaRata
      parameters:
      - name: idPrestito
        in: path
        description: ID del prestito
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        "200":
          description: Rata pagata con successo
          content:
            text/plain:
              schema:
                type: string
                example: Rata pagata con successo
        "403":
          description: Prestito non valido o non appartiene all’utente
          content:
            text/plain:
              schema:
                type: string
                example: Prestito non valido o non tuo
  /api/inviaDenaro:
    post:
      tags:
      - transazione-controller
      summary: Invia denaro a un altro utente
      description: "Permette all’utente autenticato di inviare denaro a un altro utente\
        \ specificando destinatario, importo e descrizione."
      operationId: inviaDenaro
      parameters:
      - name: destinatario
        in: query
        description: Username del destinatario
        required: true
        schema:
          type: string
        example: mrossi
      - name: importo
        in: query
        description: Importo da inviare
        required: true
        schema:
          type: number
          format: double
        example: 150.5
      - name: descrizione
        in: query
        description: Descrizione della transazione
        required: true
        schema:
          type: string
        example: Pagamento cena
      responses:
        "201":
          description: Transazione eseguita con successo
          content:
            text/plain:
              schema:
                type: string
                example: Transazione eseguita con successo
        "400":
          description: Parametri non validi
          content:
            text/plain:
              schema:
                type: string
                example: Parametri della richiesta non validi
  /api/conto/crea:
    post:
      tags:
      - conto-controller
      summary: Crea un nuovo conto
      description: Permette la creazione di un nuovo conto per l'utente autenticato
        tramite username e password.
      operationId: nuovoConto
      parameters:
      - name: username
        in: query
        description: Username dell'utente
        required: true
        schema:
          type: string
        example: mrossi
      - name: password
        in: query
        description: Password dell'utente
        required: true
        schema:
          type: string
        example: password123
      - name: alias
        in: query
        description: Alias del nuovo conto
        required: true
        schema:
          type: string
        example: Conto Risparmi
      responses:
        "201":
          description: Conto creato con successo
          content:
            text/plain:
              schema:
                type: string
                example: Conto creato
        "403":
          description: Utente non autorizzato a creare il conto
          content:
            text/plain:
              schema:
                type: string
                example: Non sei autorizzato a creare il conto
  /api/transazioni/ottieni:
    get:
      tags:
      - transazione-controller
      summary: Recupera le transazioni
      description: "Restituisce una lista di transazioni per l’utente autenticato,\
        \ paginata in base al parametro `pagina`."
      operationId: getTransazioni
      parameters:
      - name: pagina
        in: query
        description: Numero della pagina di transazioni
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        "200":
          description: Transazioni recuperate con successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransazioneDTO"
        "404":
          description: Nessuna transazione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransazioneDTO"
  /api/prestito/opzioni:
    get:
      tags:
      - prestito-controller
      summary: Calcola le opzioni di prestito disponibili
      description: "Restituisce una lista di opzioni di prestito (tasso, rate, importo)\
        \ in base all'importo richiesto."
      operationId: opzioniPrestito
      parameters:
      - name: importo
        in: query
        description: Importo per il quale calcolare le opzioni di prestito
        required: true
        schema:
          type: number
          format: double
        example: 10000
      responses:
        "200":
          description: Opzioni di prestito disponibili
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpzionePrestito"
  /api/prestiti:
    get:
      tags:
      - prestito-controller
      summary: Lista dei prestiti dell’utente
      description: Restituisce tutti i prestiti associati all’utente autenticato.
      operationId: getPrestiti
      responses:
        "200":
          description: Lista dei prestiti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestitoDTO"
  /api/conto:
    get:
      tags:
      - conto-controller
      summary: Recupera il conto attivo
      description: Restituisce le informazioni relative al conto attualmente selezionato
        dall’utente autenticato.
      operationId: getConto
      responses:
        "200":
          description: Conto attivo recuperato con successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContoDTO"
        "403":
          description: Non autorizzato ad accedere al conto attivo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContoDTO"
  /api/conto/cambia:
    get:
      tags:
      - conto-controller
      summary: Cambia conto attivo
      description: Permette di selezionare un conto come attivo tramite alias.
      operationId: cambiaConto
      parameters:
      - name: alias
        in: query
        description: Alias del conto da attivare
        required: true
        schema:
          type: string
        example: Conto Principale
      responses:
        "200":
          description: Conto cambiato con successo
          content:
            text/plain:
              schema:
                type: string
                example: Conto cambiato
        "403":
          description: Non autorizzato ad accedere al conto
          content:
            text/plain:
              schema:
                type: string
                example: Non sei autorizzato ad accedere al conto
components:
  schemas:
    TransazioneDTO:
      type: object
      description: "DTO che rappresenta una transazione bancaria, con importo positivo\
        \ o negativo a seconda che l'utente sia mittente o destinatario."
      properties:
        descrizione:
          type: string
          description: Descrizione o causale della transazione
          example: Pagamento bolletta luce
        data:
          type: string
          format: date-time
          description: Data e ora in cui la transazione è stata effettuata
          example: 2025-10-29T14:30:00
        importo:
          type: number
          format: double
          description: "Importo della transazione. Negativo se l'utente è mittente,\
            \ positivo se destinatario."
          example: -75.5
    OpzionePrestito:
      type: object
      description: DTO che rappresenta un'opzione di prestito con i dettagli delle
        rate e dei tassi applicati.
      properties:
        numeroRate:
          type: integer
          format: int32
          description: Numero totale delle rate previste per il prestito
          example: 36
        rataMensile:
          type: number
          format: double
          description: Importo della singola rata mensile
          example: 289.5
        tan:
          type: number
          format: double
          description: Tasso Annuo Nominale (TAN) espresso in percentuale
          example: 5.5
        taeg:
          type: number
          format: double
          description: Tasso Annuo Effettivo Globale (TAEG) espresso in percentuale
          example: 5.8
        totaleDovuto:
          type: number
          format: double
          description: Importo totale dovuto alla fine del piano di rimborso
          example: 10422.0
    PrestitoDTO:
      type: object
      description: "DTO che rappresenta un prestito con i dettagli relativi all'importo,\
        \ ai tassi e allo stato di rimborso."
      properties:
        idPrestito:
          type: integer
          format: int32
          description: Identificativo univoco del prestito
          example: 42
        importo:
          type: number
          format: double
          description: Importo totale richiesto per il prestito
          example: 10000.0
        numeroRate:
          type: integer
          format: int32
          description: Numero totale di rate previste per il rimborso
          example: 36
        tan:
          type: number
          format: double
          description: Tasso Annuo Nominale (TAN) espresso in percentuale
          example: 5.0
        taeg:
          type: number
          format: double
          description: Tasso Annuo Effettivo Globale (TAEG) espresso in percentuale
          example: 5.3
        rataMensile:
          type: number
          format: double
          description: Importo della singola rata mensile
          example: 300.5
        importoPagato:
          type: number
          format: double
          description: Importo totale già rimborsato sul prestito
          example: 1200.0
    ContoDTO:
      type: object
      description: Data Transfer Object che rappresenta un conto bancario dell'utente
      properties:
        idConto:
          type: integer
          format: int32
          description: Identificativo univoco del conto
          example: 101
        alias:
          type: string
          description: Alias o nome personalizzato assegnato al conto
          example: Conto Principale
        saldo:
          type: number
          format: double
          description: Saldo corrente del conto
          example: 1530.75
        pan:
          type: string
          description: Numero PAN della carta associata al conto (parzialmente mascherato)
          example: 1234-5678-****-9012
        annoScadenza:
          type: integer
          format: int32
          description: Anno di scadenza della carta
          example: 2027
        meseScadenza:
          type: integer
          format: int32
          description: Mese di scadenza della carta
          example: 12
        cvv:
          type: string
          description: Codice di sicurezza della carta (CVV)
          example: 123
        iban:
          type: string
          description: IBAN del conto
          example: IT60X0542811101000000123456
        principale:
          type: boolean
          description: Indica se il conto è il principale per l'utente
          example: true
